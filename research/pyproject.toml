[project]
name = "litflow-research"
version = "0.1.0"
description = "rsx: the orchestrator of the litflow literature workflow - next step, stage gates, citation check and the Pi agents that review each other"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "obsidian-vault",
    "typer>=0.12",
]

[project.scripts]
rsx = "rsx.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rsx"]

[tool.uv.sources]
obsidian-vault = { path = "../obsidian", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes (undefined names, unused imports, etc.)
    "W",     # pycodestyle warnings
    "I",     # isort (import sorting)
    "UP",    # pyupgrade (use modern Python syntax)
    "B",     # flake8-bugbear (catches likely bugs)
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",    # line-too-long: ruff format wraps code; long strings/URLs stay
    "RUF001",  # ambiguous-unicode-character-string (…, ×, – in messages)
    "RUF002",  # ambiguous-unicode-character-docstring
    "RUF003",  # ambiguous-unicode-character-comment
]

[tool.ruff.lint.flake8-bugbear]
# Typer declares options as argument defaults
extend-immutable-calls = ["typer.Argument", "typer.Option"]
