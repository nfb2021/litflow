[project]
name = "zotero-skill"
version = "0.1.0"
description = "zot: import DOIs into Zotero with their PDFs, list PDF paths, extract cited references - CLI and Claude Code skill"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
zot = "zotero.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zotero"]

[dependency-groups]
docs = [
    "marimo>=0.25.2",
]
dev = [
    "ruff>=0.17",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes (undefined names, unused imports, etc.)
    "W",     # pycodestyle warnings
    "I",     # isort (import sorting)
    "UP",    # pyupgrade (use modern Python syntax)
    "B",     # flake8-bugbear (catches likely bugs)
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",    # line-too-long: ruff format wraps code; long strings/URLs stay
    "RUF001",  # ambiguous-unicode-character-string (…, ×, – in messages)
    "RUF002",  # ambiguous-unicode-character-docstring
    "RUF003",  # ambiguous-unicode-character-comment
]

[tool.ruff.lint.flake8-bugbear]
# Typer declares options as argument defaults
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
"docs/*.py" = ["B018"]  # marimo cells display via bare expressions
