name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: read-all

jobs:
  opencode:
    name: opencode
    # The repo is public: only people with write access can spend the Aqueduct key
    if: |
      github.event.comment.user.type != 'Bot'
      && (contains(github.event.comment.body, ' /oc') || startsWith(github.event.comment.body, '/oc')
        || contains(github.event.comment.body, ' /opencode') || startsWith(github.event.comment.body, '/opencode'))
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: write
      actions: read # CI logs, for gh run view
      checks: read # gh pr checks
      security-events: read # Code scanning alerts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anomalyco/opencode/github@dc2ffcf8bf26f9e669b6aa22b95f50e12be15e06 # v2.2.6
        env:
          AQUEDUCT_API_KEY: ${{ secrets.AQUEDUCT_API_KEY }}
          GH_TOKEN: ${{ github.token }} # Read-only, for gh; pushes use the app's token
          OPENCODE_CONFIG_CONTENT: |
            {
              "provider": {
                "aqueduct": {
                  "npm": "@ai-sdk/openai-compatible",
                  "name": "TU Wien Aqueduct",
                  "options": {
                    "baseURL": "https://aqueduct.ai.datalab.tuwien.ac.at/v1",
                    "apiKey": "{env:AQUEDUCT_API_KEY}"
                  },
                  "models": { "main": { "name": "main" } }
                }
              }
            }
        with:
          model: aqueduct/main
