name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: read-all

jobs:
  opencode:
    name: opencode
    # The repo is public: only people with write access can spend the Aqueduct key
    if: |
      (contains(github.event.comment.body, ' /oc') || startsWith(github.event.comment.body, '/oc')
        || contains(github.event.comment.body, ' /opencode') || startsWith(github.event.comment.body, '/opencode'))
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anomalyco/opencode/github@810c0eba1a7348036f8bdf61e6632d0c36c6876c # v1.19.5
        env:
          AQUEDUCT_API_KEY: ${{ secrets.AQUEDUCT_API_KEY }}
        with:
          model: aqueduct/glm-5.3-744b-experimental
