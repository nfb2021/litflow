name: Secret Scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ggshield:
    name: GitGuardian
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # ggshield scans every commit of the push / PR
          persist-credentials: false
      - name: Skip without an API key
        id: key
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: |
          if [ -z "$GITGUARDIAN_API_KEY" ]; then
            echo "::warning::GITGUARDIAN_API_KEY secret is not set - secret scan skipped"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: GitGuardian scan
        if: steps.key.outputs.present == 'true'
        uses: GitGuardian/ggshield-action@5cc1ed2be3e8bf625d354c7170731880670f74de # v1.56.1
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
